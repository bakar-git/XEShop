<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- BOOTSTRAP CSS -->
    <!-- cdn -->
    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous"> -->
    <!-- local -->
    <link rel="stylesheet" href="asset/lib/bs5/bootstrap.min.css">
    <!-- CUSTOM CSS -->
    <!-- local -->
    <link rel="stylesheet" href="asset/css/login.css">
    <link rel="stylesheet" href="asset/css/style.css">
    <title>XEShop</title>
    <!-- Icon -->
    <link rel="icon" type="image/x-icon" href="asset/image/app/favicon.ico">
</head>

<body>

    <div class="text-center mb-4 py-3 border-bottom border-ae-light-1 border-1">
        <img src="asset/image/app/png-200x50.png">
    </div>

    <div class="mx-auto" style="max-width: 400px;" id="login">
        <!-- Tabs -->
        <ul class="fs-5 nav nav-pills text-center justify-content-center">
            <li class="nav-item">
                <a class="nav-link active" data-bs-toggle="tab" href="#tab-login">Login</a>
                <hr style="height: 3px;width: 40%;" class="mx-auto my-0 text-ae-danger">
            </li>
            <li class="nav-item">
                <a class="nav-link" data-bs-toggle="tab" href="#tab-register">Register</a>
                <hr style="height: 3px;width: 40%;" class="mx-auto my-0 text-ae-danger">
            </li>
        </ul>
        <!-- Tabs -->

        <!-- Content -->
        <div class="tab-content px-3 mt-4 text-black-50">
            <form class="tab-pane fade show active" id="tab-login">
                <!-- Email input -->
                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="userEmail" placeholder="name@example.com">
                    <label for="userEmail">Email address</label>
                </div>
                <!-- Password input -->
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="userPassword" placeholder="name@example.com">
                    <label for="userPassword">Password</label>
                </div>
                <a href="#" class="btn-link text-decoration-none mb-3 d-block">Forgot Password?</a>
                <button type="submit" class="btn btn-ae-danger text-white fw-bold w-100 fs-5 py-2 rounded-pill">Sign in</button>
                <div class="text-center mt-5">
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <hr style="height: 1px;" class="w-25 m-0 text-dark">
                        <span class="mx-2 text-black-50 fs-5">or continue with</span>
                        <hr style="height: 1px;" class="w-25 m-0 text-dark">
                    </div>
                    <button type="button" class="btn text-info mx-1">
                        <i class="fab fa-3x fa-facebook-square"></i>
                    </button>
                    <button type="button" class="btn text-danger mx-1">
                        <i class="fab fa-3x fa-google-plus-square"></i>
                    </button>

                    <button type="button" class="btn text-primary mx-1">
                        <i class="fab fa-3x fa-twitter-square"></i>
                    </button>

                    <button type="button" class="btn text-secondary mx-1">
                        <i class="fab fa-3x fa-instagram-square"></i>
                    </button>
                </div>
            </form>
            <form class="tab-pane fade" id="tab-register">
                <div class="form-floating mb-2">
                    <select class="form-select" id="userLocation">
                      <option selected>Open this select menu</option>
                      <option value="1">One</option>
                      <option value="2">Two</option>
                      <option value="3">Three</option>
                    </select>
                    <label for="userLocation">Location</label>
                </div>
                <!-- Email input -->
                <div class="form-floating mb-2">
                    <input type="email" class="form-control" id="userEmail" placeholder="name@example.com">
                    <label for="userEmail">Email address</label>
                </div>
                <!-- Password input -->
                <div class="form-floating mb-3">
                    <input type="password" class="form-control" id="userPassword" placeholder="name@example.com">
                    <label for="userPassword">Password</label>
                </div>
                <button type="submit" class="btn btn-ae-danger text-white fw-bold w-100 fs-5 py-2 rounded-pill">Sign in</button>
                <div class="text-center mt-5">
                    <div class="d-flex align-items-center justify-content-center mb-3">
                        <hr style="height: 1px;" class="w-25 m-0 text-dark">
                        <span class="mx-2 text-black-50 fs-5">or continue with</span>
                        <hr style="height: 1px;" class="w-25 m-0 text-dark">
                    </div>
                    <button type="button" class="btn text-info mx-1">
                        <i class="fab fa-3x fa-facebook-square"></i>
                    </button>
                    <button type="button" class="btn text-danger mx-1">
                        <i class="fab fa-3x fa-google-plus-square"></i>
                    </button>

                    <button type="button" class="btn text-primary mx-1">
                        <i class="fab fa-3x fa-twitter-square"></i>
                    </button>

                    <button type="button" class="btn text-secondary mx-1">
                        <i class="fab fa-3x fa-instagram-square"></i>
                    </button>
                </div>
            </form>
        </div>
        <!-- Content -->
    </div>




    <!-- BOOTSTRAP JS -->
    <!-- cdn -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script> -->
    <script src="asset/lib/bs5/bootstrap.bundle.min.js"></script>

    <!-- CUSTOM JS -->
    <script src="asset/js/login.js"></script>
    <script src="asset/js/main.js"></script>

    <!-- local -->
    <link rel="stylesheet" href="asset/lib/fa6/css/all.min.css">
</body>

</html>
